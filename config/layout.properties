# Карта физических путей проекта (шаг 2 переезда на модули).
# Логический путь — путь файла относительно корня пакета com/theminespirit;
# сторожам и baseline-файлам не нужно знать, в каком Gradle-модуле он лежит.
# Корни модулей здесь НЕ перечисляются: единственный источник — settings.gradle
# (include ':модуль'), остальные инструменты разбирают его сами.
# Корни исходников тоже не дублируются: их задаёт соглашение build-logic
# (<модуль>/src/main/java, <модуль>/src/test/java); api и mod — модули settings.
package_root=com/theminespirit
resources=mod/src/main/resources
test_resources=src/test/resources
templates=mod/src/main/templates
generated_resources=mod/src/generated/resources
jar_dir=build/libs
gametests=gametest/src/main/java/com/theminespirit/gametest
gametest_test=gametest/src/test/java
