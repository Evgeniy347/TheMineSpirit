tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        csv.required = false
        xml.required = true
        xml.outputLocation = file('TestResults/coverage/jacoco.xml')
        html.required = true
        html.outputLocation = file('TestResults/coverage/html')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('runGameTestServer') {
    doFirst {
        new File(gameDirectory.getAsFile().get(), 'world').deleteDir()
        def lockPath = System.getProperty('theminespirit.gametest.lock')
        def token = (System.getProperty('theminespirit.gametest.token') ?: '').trim()
        if (!lockPath || !token) {
            throw new GradleException("runGameTestServer: прямой запуск без замка запрещён. Используй scripts/test.sh gametest (docs/TESTING.md): скрипт берёт замок и передаёт -Dtheminespirit.gametest.lock/-Dtheminespirit.gametest.token.")
        }
        def dirToken = new File(lockPath + '.d/token')
        def fileToken = new File(lockPath + '.token')
        def markerToken = dirToken.exists() ? dirToken.getText('UTF-8').trim() : (fileToken.exists() ? fileToken.getText('UTF-8').trim() : '')
        if (markerToken != token) {
            throw new GradleException("runGameTestServer: токен замка не совпадает (${markerToken ? 'устаревший или чужой замок' : 'замок отсутствует'}). Прямой запуск запрещён: scripts/test.sh gametest (docs/TESTING.md).")
        }
    }
}

tasks.register('schematicTool', JavaExec) {
    group = 'theminespirit'
    description = 'Постройки в текстовом формате: show <файл|id> [поворот], check [файл|id…]'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.theminespirit.core.building.SchematicTool'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
    workingDir = projectDir
    args((System.getProperty('theminespirit.schematic.args') ?: '').split('\u0001').findAll { !it.isEmpty() })
}
