plugins {
    id 'theminespirit.neoforge-mod'
    id 'maven-publish'
    id 'jacoco'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def resolveBuildNumber = {
    def explicit = project.findProperty('build_number')
    if (explicit != null) {
        def text = explicit.toString().trim()
        if (!(text ==~ /[1-9][0-9]*/)) {
            throw new GradleException("build_number должен быть положительным целым числом, получено: '${explicit}'")
        }
        return text.toInteger()
    }
    try {
        def git = providers.exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            ignoreExitValue = true
        }
        def result = git.result.get()
        def text = git.standardOutput.asText.get().trim()
        if (result.exitValue != 0 || !(text ==~ /[1-9][0-9]*/)) {
            throw new GradleException("Не удалось вычислить номер сборки: 'git rev-list --count HEAD' вернул код "
                    + "${result.exitValue} и '${text}'. Проверьте, что проект — git-репозиторий с коммитами, "
                    + "или задайте номер явно: ./gradlew build -Pbuild_number=N")
        }
        return text.toInteger()
    } catch (GradleException error) {
        throw error
    } catch (Exception error) {
        throw new GradleException("Не удалось вычислить номер сборки: git недоступен (${error.message}). "
                + "Установите git или задайте номер явно: ./gradlew build -Pbuild_number=N", error)
    }
}
def modVersion = "${mod_version_minor}.${resolveBuildNumber()}"
version = modVersion
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
        }
    }
}

base {
    archivesName = mod_id
}

sourceSets.main.output.classesDirs.from(provider {
    project(':api').sourceSets.main.output.classesDirs +
            project(':policy').sourceSets.main.output.classesDirs +
            project(':mech:mining').sourceSets.main.output.classesDirs +
            project(':mech:movement').sourceSets.main.output.classesDirs +
            project(':mech:inventory').sourceSets.main.output.classesDirs +
            project(':mech:farming').sourceSets.main.output.classesDirs +
            project(':mech:forestry').sourceSets.main.output.classesDirs +
            project(':mech:crafting').sourceSets.main.output.classesDirs +
            project(':mech:husbandry').sourceSets.main.output.classesDirs +
            project(':mech:building').sourceSets.main.output.classesDirs +
            project(':mech:town').sourceSets.main.output.classesDirs
})
tasks.named('classes') {
    dependsOn ':api:classes', ':policy:classes'
    dependsOn ':mech:mining:classes', ':mech:movement:classes', ':mech:inventory:classes'
    dependsOn ':mech:farming:classes', ':mech:forestry:classes', ':mech:crafting:classes', ':mech:husbandry:classes'
    dependsOn ':mech:building:classes', ':mech:town:classes'
}

neoForge {
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'theminespirit.gametest.filter', providers.systemProperty('theminespirit.gametest.filter').orElse('').get()
            systemProperty 'theminespirit.gametest.seed', providers.systemProperty('theminespirit.gametest.seed').orElse('').get()
            jvmArguments.addAll '-XX:+UseSerialGC', '-Xmx1536m', '-XX:+ExitOnOutOfMemoryError'
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG

            if (name == 'gameTestServer') {
                logLevel = org.slf4j.event.Level.INFO
                gameDirectory = project.file(providers.systemProperty('theminespirit.gametest.dir').orElse('build/gametest-run').get())
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':api')
    implementation project(':policy')
    implementation project(':mech:mining')
    implementation project(':mech:movement')
    implementation project(':mech:inventory')
    implementation project(':mech:farming')
    implementation project(':mech:forestry')
    implementation project(':mech:crafting')
    implementation project(':mech:husbandry')
    implementation project(':mech:building')
    implementation project(':mech:town')
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    additionalRuntimeClasspath "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    jarJar("com.fasterxml.jackson.core:jackson-databind:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }
    jarJar("com.fasterxml.jackson.core:jackson-core:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }
    jarJar("com.fasterxml.jackson.core:jackson-annotations:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"





}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

def unitTestThreads = (System.getenv('THEMINESPIRIT_TEST_THREADS') ?: "${Math.max(1, Math.min(5, Runtime.runtime.availableProcessors() - 1))}") as int
tasks.named('test', Test) {
    dependsOn ':api:test', ':policy:test'
    dependsOn ':mech:mining:test', ':mech:movement:test', ':mech:inventory:test'
    dependsOn ':mech:farming:test', ':mech:forestry:test', ':mech:crafting:test', ':mech:husbandry:test'
    dependsOn ':mech:building:test', ':mech:town:test'
    useJUnitPlatform {
        excludeTags 'slow', 'mutation', 'export'
    }
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', "${unitTestThreads}"
    jvmArgs '-XX:+UseSerialGC', "-XX:ActiveProcessorCount=${Math.max(2, unitTestThreads)}"
    maxHeapSize = '512m'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/unit/test-cost.csv'
    systemProperty 'theminespirit.updateSnapshots',
            System.getProperty('theminespirit.updateSnapshots', System.getenv('THEMINESPIRIT_UPDATE_SNAPSHOTS') ?: 'false')
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/unit/html')
    reports.junitXml.outputLocation = file('TestResults/unit/xml')
}

tasks.named('staticAnalysisFast') {
    dependsOn ':policy:staticAnalysisFast'
    dependsOn ':mech:mining:staticAnalysisFast', ':mech:movement:staticAnalysisFast', ':mech:inventory:staticAnalysisFast'
    dependsOn ':mech:farming:staticAnalysisFast'
    dependsOn ':mech:forestry:staticAnalysisFast'
    dependsOn ':mech:crafting:staticAnalysisFast'
    dependsOn ':mech:husbandry:staticAnalysisFast'
    dependsOn ':mech:building:staticAnalysisFast', ':mech:town:staticAnalysisFast'
}
tasks.named('staticAnalysis') {
    dependsOn ':policy:staticAnalysis'
    dependsOn ':mech:mining:staticAnalysis', ':mech:movement:staticAnalysis', ':mech:inventory:staticAnalysis'
    dependsOn ':mech:farming:staticAnalysis'
    dependsOn ':mech:forestry:staticAnalysis'
    dependsOn ':mech:crafting:staticAnalysis'
    dependsOn ':mech:husbandry:staticAnalysis'
    dependsOn ':mech:building:staticAnalysis', ':mech:town:staticAnalysis'
}

tasks.register('slowTest', Test) {
    group = 'verification'
    description = 'Медленные тесты с тегом slow: только для теста, который не влезает в бюджет быстрого тира'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
    maxParallelForks = 1
    systemProperty 'jqwik.tries.default', '1000'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/slow/test-cost.csv'
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/slow/html')
    reports.junitXml.outputLocation = file('TestResults/slow/xml')
    shouldRunAfter tasks.named('test')
}

tasks.register('mutationTest', Test) {
    group = 'verification'
    description = 'Мутационный перебор ситуаций доски и графа (тег mutation): бюджет 10–20 минут, выборки с ротацией сида'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mutation'
    }
    maxParallelForks = (System.getenv('THEMINESPIRIT_MUTATION_FORKS') ?: "${Math.max(1, Math.min(5, Runtime.runtime.availableProcessors() - 1))}") as int
    maxHeapSize = '2g'
    systemProperty 'theminespirit.modId', project.mod_id
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/mutation/html')
    reports.junitXml.outputLocation = file('TestResults/mutation/xml')
}

tasks.register('graphExport', Test) {
    group = 'verification'
    description = 'Выгрузка графа и контрольных случаев для Python-модели (tools/graph-gpu): TestResults/graph-export'
