plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // C1, SerialGC и потолок памяти: замер (docs/research/test-performance.md) дал wall 72–124 → 37–48 с,
            // CPU −60 %. -Xmx1536m — запас над замеренным RSS 0,65 ГБ, чтобы OOM не выглядел падением сервера;
            // ExitOnOutOfMemoryError превращает OOM в понятный выход, а не в зависание.
            jvmArguments.addAll '-XX:TieredStopAtLevel=1', '-XX:+UseSerialGC', '-Xmx1536m', '-XX:+ExitOnOutOfMemoryError'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For scanning mods.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-logging-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    additionalRuntimeClasspath "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    jarJar("com.fasterxml.jackson.core:jackson-databind:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }
    jarJar("com.fasterxml.jackson.core:jackson-core:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }
    jarJar("com.fasterxml.jackson.core:jackson-annotations:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.junit.platform:junit-platform-launcher"

    testImplementation "net.jqwik:jqwik:${jqwik_version}"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Предупреждения компилятора — ошибки сборки (правило проекта: docs/CONVENTIONS.md)
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing', '-Werror'])
}

// Быстрые JUnit-тесты чистой логики без запуска игры (docs/TESTING.md).
// Свойства jqwik и тесты на масштаб идут этим же прогоном; тег slow оставлен для будущего
// тяжёлого теста, который не влезает в бюджет (гоняет задача slowTest отдельно, в check он не входит).
// Параллельные форки выключены: замер на 4 ядрах показал, что 2 форка дороже старта второй JVM
// и обгоняют прогон (числа — docs/TESTING.md → «Параллельный прогон и теги»).
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'slow'
    }
    maxParallelForks = 1
    // Быстрый тир — только C1, SerialGC и два потока: замер (docs/research/test-performance.md)
    // дал −58 % CPU тестовой JVM. C1-only не ставим в slowTest: долгие вычисления выигрывают от C2.
    jvmArgs '-XX:TieredStopAtLevel=1', '-XX:+UseSerialGC', '-XX:ActiveProcessorCount=2'
    maxHeapSize = '512m'
    systemProperty 'theminespirit.modId', project.mod_id
    // Слушатель тестовой стоимости пишет CSV в путь от задачи (docs/TESTING.md → «Время тестов»)
    systemProperty 'theminespirit.testCost.csv', 'TestResults/unit/test-cost.csv'
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/unit/html')
    reports.junitXml.outputLocation = file('TestResults/unit/xml')
}

// Медленный тир: только тесты с тегом slow (docs/TESTING.md). Сейчас пуст: тяжёлых тестов нет.
tasks.register('slowTest', Test) {
    group = 'verification'
    description = 'Медленные тесты с тегом slow: только для теста, который не влезает в бюджет быстрого тира'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
    maxParallelForks = 1
    // Медленный тир гоняет свойства с повышенным числом попыток; число test и slowTest несравнимы
    // (в test ещё C1-only). Системное свойство перекрывает junit-platform.properties (jqwik читает его
    // через параметры конфигурации JUnit), но не явный @Property(tries = …). См. docs/TESTING.md.
    systemProperty 'jqwik.tries.default', '1000'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/slow/test-cost.csv'
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/slow/html')
    reports.junitXml.outputLocation = file('TestResults/slow/xml')
    shouldRunAfter tasks.named('test')
}

// Глубокий прогон свойств: 1000 попыток на каждое (docs/TESTING.md). Без фильтра тегов — все
// @Property идут с tries=1000. Не в check: предназначен для ночного прогона или по запросу.
tasks.register('propertyTest', Test) {
    group = 'verification'
    description = 'Свойства jqwik с 1000 попытками: глубокий прогон инвариантов'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'jqwik'
    }
    maxParallelForks = 1
    systemProperty 'jqwik.tries.default', '1000'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/property/test-cost.csv'
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/property/html')
    reports.junitXml.outputLocation = file('TestResults/property/xml')
    shouldRunAfter tasks.named('test')
}

// Подсветка долгих тестов (docs/TESTING.md → «Время тестов»): после test и slowTest печатает
// топ-10 по CPU потока и строки выше порога с пометкой МЕДЛЕННЫЙ. Пороги — в одном файле
// test-cost-thresholds.properties (миллисекунды). Логика отчёта — в TestCostReporter
// (JUnit-тест TestCostReporterTests проверяет её на таблице случаев).
tasks.register('testCostReport', JavaExec) {
    group = 'verification'
    description = 'Топ-10 и МЕДЛЕННЫЙ по CPU из CSV стоимости тестов'
    dependsOn tasks.named('test')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.theminespirit.testing.TestCostReporter'
    args 'TestResults/unit/test-cost.csv', 'src/test/resources/test-cost-thresholds.properties'
}

tasks.register('slowTestCostReport', JavaExec) {
    group = 'verification'
    description = 'Топ-10 и МЕДЛЕННЫЙ по CPU из CSV медленного тира'
    dependsOn tasks.named('slowTest')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.theminespirit.testing.TestCostReporter'
    args 'TestResults/slow/test-cost.csv', 'src/test/resources/test-cost-thresholds.properties'
}

// Пустой тир не должен молча зеленеть: если фильтр не нашёл ни одного теста,
// задача падает с понятным сообщением. failOnNoDiscoveredTests покрывает только случай
// без фильтров, а теги (test/slowTest) — это фильтры, поэтому считаем отчёты сами.
tasks.withType(Test).configureEach {
    def executedTests = new java.util.concurrent.atomic.AtomicLong()
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            executedTests.set(result.testCount)
        }
    }
    doLast {
        if (executedTests.get() == 0) {
            throw new GradleException("Тестовая задача '${name}' выполнила 0 тестов: проверьте фильтры " +
                    "(теги, --tests). Пустой тир не должен молча зеленеть (см. docs/TESTING.md).")
        }
    }
}

// check гоняет быстрый тир. slowTest намеренно НЕ входит в check: сейчас в нём нет тестов, а
// пустой тир по R10 падает, и check/build стали бы вечно красными. slowTest запускают отдельно,
// когда появится тяжёлый тест с замеренным временем (docs/TESTING.md).
tasks.named('check') {
    dependsOn tasks.named('test')
}

// Подсветка долгих печатается после прогона, даже зелёного (docs/TESTING.md → «Время тестов»)
tasks.named('test') {
    finalizedBy tasks.named('testCostReport')
}

tasks.named('slowTest') {
    finalizedBy tasks.named('slowTestCostReport')
}

// Покрытие JaCoCo — отчёт, а не гейт сборки (docs/TESTING.md).
// Версия инструмента — встроенная в Gradle, отдельно не выбирается (AGENTS.md).
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        csv.required = false
        xml.required = true
        xml.outputLocation = file('TestResults/coverage/jacoco.xml')
        html.required = true
        html.outputLocation = file('TestResults/coverage/html')
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
