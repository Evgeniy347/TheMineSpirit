plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'net.neoforged.moddev'
    id 'idea'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

// Версия — <минор>.<N>: минор задан в gradle.properties вручную, N — число коммитов HEAD.
// Без git версия не подставляется молча: нужен явный номер (./gradlew build -Pbuild_number=N),
// иначе сверка сборок клиента и сервера сравнивала бы разные jar под одним номером.
def resolveBuildNumber = {
    def explicit = project.findProperty('build_number')
    if (explicit != null) {
        def text = explicit.toString().trim()
        if (!(text ==~ /[1-9][0-9]*/)) {
            throw new GradleException("build_number должен быть положительным целым числом, получено: '${explicit}'")
        }
        return text.toInteger()
    }
    try {
        def git = providers.exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            ignoreExitValue = true
        }
        def result = git.result.get()
        def text = git.standardOutput.asText.get().trim()
        if (result.exitValue != 0 || !(text ==~ /[1-9][0-9]*/)) {
            throw new GradleException("Не удалось вычислить номер сборки: 'git rev-list --count HEAD' вернул код "
                    + "${result.exitValue} и '${text}'. Проверьте, что проект — git-репозиторий с коммитами, "
                    + "или задайте номер явно: ./gradlew build -Pbuild_number=N")
        }
        return text.toInteger()
    } catch (GradleException error) {
        throw error
    } catch (Exception error) {
        throw new GradleException("Не удалось вычислить номер сборки: git недоступен (${error.message}). "
                + "Установите git или задайте номер явно: ./gradlew build -Pbuild_number=N", error)
    }
}
def modVersion = "${mod_version_minor}.${resolveBuildNumber()}"
version = modVersion
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Фильтр GameTest по имени пачки/класса/теста (scripts/test.sh gametest <фильтр>):
            // пусто или не задано — идут все тесты. providers.systemProperty — чтобы configuration cache
            // видел смену -D между прогонами.
            systemProperty 'theminespirit.gametest.filter', providers.systemProperty('theminespirit.gametest.filter').orElse('').get()
            // Сид генерируемой сцены (scripts/test.sh gametest --seed N): пусто — сцена берёт новый случайный.
            systemProperty 'theminespirit.gametest.seed', providers.systemProperty('theminespirit.gametest.seed').orElse('').get()
            // Исключения (быстрый набор) и номер шарда игра читает из theminespirit-gametest.properties
            // в своём gameDirectory: общий файл аргументов JVM при трёх одновременных серверах перезаписывается.
            // SerialGC и потолок памяти. C1-only (TieredStopAtLevel=1) снят 23.10: он ускорял старт на 15 тестах,
            // а на 930 тестах тики стройки идут в 2,2 раза дольше: пачки полного прогона 1390–1480 с → 765 с (C1+C2).
            // -Xmx1536m — запас над замеренным RSS 0,65 ГБ, чтобы OOM не выглядел падением сервера;
            // ExitOnOutOfMemoryError превращает OOM в понятный выход, а не в зависание.
            jvmArguments.addAll '-XX:+UseSerialGC', '-Xmx1536m', '-XX:+ExitOnOutOfMemoryError'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For scanning mods.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-logging-levels
            logLevel = org.slf4j.event.Level.DEBUG

            if (name == 'gameTestServer') {
                // GameTest — свой каталог и INFO вместо DEBUG: мир на каждый прогон новый
                // (docs/TESTING.md), а лог не заваливается DEBUG-шумом
                // (docs/research/test-performance.md → п.7)
                logLevel = org.slf4j.event.Level.INFO
                // Шарды идут одновременно, у каждого свой каталог мира (scripts/test.sh gametest).
                gameDirectory = project.file(providers.systemProperty('theminespirit.gametest.dir').orElse('build/gametest-run').get())
            }
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    additionalRuntimeClasspath "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    jarJar("com.fasterxml.jackson.core:jackson-databind:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }
    jarJar("com.fasterxml.jackson.core:jackson-core:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }
    jarJar("com.fasterxml.jackson.core:jackson-annotations:${jackson_version}") {
        version {
            strictly "${jackson_version_range}"
            prefer "${jackson_version}"
        }
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.junit.platform:junit-platform-launcher"

    testImplementation "net.jqwik:jqwik:${jqwik_version}"
    // Архитектурные правила зависимостей пакетов (tasks/46 п.7)
    testImplementation "com.tngtech.archunit:archunit:${archunit_version}"

    errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
    errorprone "com.uber.nullaway:nullaway:${nullaway_version}"
    // Аннотации null — только на компиляции: в игре они не нужны (tasks/46 п.3)
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
    testCompileOnly "org.jspecify:jspecify:${jspecify_version}"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Предупреждения компилятора — ошибки сборки (правило проекта: docs/CONVENTIONS.md)
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing', '-Werror'])
    // Error Prone (tasks/46): его предупреждения тоже ошибки через -Werror. Выключенные проверки — с причиной.
    options.errorprone {
        disableWarningsInGeneratedCode = true
        // EventBus NeoForge снимает слушателя только по тому же экземпляру: лямбда в поле — намеренно.
        disable('UnnecessaryLambda')
        // Неизменяемость enum-полей EP доказывает только для Guava/@Immutable: в core Guava нет, а Block/Item —
        // неизменяемые синглтоны реестра Minecraft без аннотаций; проверка давала бы только ложные срабатывания.
        disable('ImmutableEnumChecker')
    }
}

// NullAway (tasks/46 п.3) — только production-ядро: тесты намеренно передают null, а адаптеры к Minecraft
// живут в чужой модели null. В core тип без @Nullable (JSpecify) — не null.
tasks.named('compileJava', JavaCompile) {
    options.errorprone {
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        option('NullAway:AnnotatedPackages', 'com.theminespirit.core')
    }
}

tasks.named('compileTestJava', JavaCompile) {
    options.errorprone.disable('NullAway')
}

// Строгие анализаторы (tasks/46-static-analyzers.md): нарушение роняет сборку, временных списков нет.
// staticAnalysis — все проверки, кроме компилятора; входит в check и в полный scripts/test.sh unit (хук pre-commit).
spotless {
    java {
        target 'src/*/java/**/*.java'
        // Отступ 4, как в проекте; google-java-format отвергнут (отступ 2). Исправление — ./gradlew spotlessApply.
        palantirJavaFormat(palantir_java_format_version)
    }
}

// Checkstyle — минимальный набор config/checkstyle/checkstyle.xml (что в него не входит и почему — там же).
checkstyle {
    toolVersion = checkstyle_version
    maxWarnings = 0
    ignoreFailures = false
}

// PMD — свои наборы config/pmd/main.xml и test.xml (выключенные правила и причины — там же).
pmd {
    toolVersion = pmd_version
    consoleOutput = false
    ignoreFailures = false
    ruleSets = []
}
tasks.named('pmdMain', Pmd) {
    ruleSetFiles = files('config/pmd/main.xml')
}
tasks.named('pmdTest', Pmd) {
    ruleSetFiles = files('config/pmd/test.xml')
}

// SpotBugs — байткод-анализ; исключения правил целиком и причины — config/spotbugs/exclude.xml.
spotbugs {
    toolVersion = spotbugs_version
    ignoreFailures = false
    excludeFilter = file('config/spotbugs/exclude.xml')
}
tasks.named('spotbugsTest') {
    excludeFilter = file('config/spotbugs/exclude-test.xml')
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = false
    }
}

// Быстрые анализаторы — то, что дёшево гонять в каждом коммите (хук pre-commit): формат и стиль.
// SpotBugs и PMD (сотни секунд) — только приёмка перед слиянием (scripts/lead/chkq.sh) и check.
tasks.register('staticAnalysisFast') {
    group = 'verification'
    description = 'Быстрые анализаторы: формат (Spotless), Checkstyle — без SpotBugs и PMD'
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
}

tasks.register('staticAnalysis') {
    group = 'verification'
    description = 'Строгие анализаторы кода: формат (Spotless) и прочие из tasks/46'
    dependsOn tasks.named('staticAnalysisFast')
    dependsOn tasks.named('pmdMain'), tasks.named('pmdTest')
    dependsOn tasks.named('spotbugsMain'), tasks.named('spotbugsTest')
}

tasks.named('check') {
    dependsOn tasks.named('staticAnalysis')
}

// Быстрые JUnit-тесты чистой логики без запуска игры (docs/TESTING.md).
// Свойства jqwik и тесты на масштаб идут этим же прогоном; тег slow оставлен для будущего
// тяжёлого теста, который не влезает в бюджет (гоняет задача slowTest отдельно, в check он не входит).
// Форк один (одна база jqwik, одна JVM на исполнителя). Внутри — классы Jupiter параллельно:
// потоков = ядра − 2, от 1 до 4 (сервер 4 ядра → 2, ПК 6 ядер → 4); THEMINESPIRIT_TEST_THREADS перекрывает.
// Замеры 23.10 (6327 тестов, ПК 6 ядер): последовательно 148 с, C2 вместо C1-only 80 с, плюс 4 потока 46 с
// (docs/TESTING.md → «Время»). Класс с общим состоянием — @Isolated.
def unitTestThreads = (System.getenv('THEMINESPIRIT_TEST_THREADS') ?: "${Math.max(1, Math.min(4, Runtime.runtime.availableProcessors() - 2))}") as int
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'slow'
    }
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', "${unitTestThreads}"
    // C1+C2 (без TieredStopAtLevel=1): тестов 6 тыс., тяжёлые планы стройки идут десятки секунд, и C2 даёт
    // −45 % wall всего тира (148 → 80 с); C1-only выигрывал на 228 мелких тестах (docs/research/test-performance.md).
    jvmArgs '-XX:+UseSerialGC', "-XX:ActiveProcessorCount=${Math.max(2, unitTestThreads)}"
    maxHeapSize = '512m'
    systemProperty 'theminespirit.modId', project.mod_id
    // Слушатель тестовой стоимости пишет CSV в путь от задачи (docs/TESTING.md → «Время тестов»)
    systemProperty 'theminespirit.testCost.csv', 'TestResults/unit/test-cost.csv'
    // Снапшоты планов стройки перезаписываются только явным флагом (BuildPlanSnapshotTests)
    systemProperty 'theminespirit.updateSnapshots',
            System.getProperty('theminespirit.updateSnapshots', System.getenv('THEMINESPIRIT_UPDATE_SNAPSHOTS') ?: 'false')
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/unit/html')
    reports.junitXml.outputLocation = file('TestResults/unit/xml')
}

// Медленный тир: только тесты с тегом slow (docs/TESTING.md). Сейчас пуст: тяжёлых тестов нет.
tasks.register('slowTest', Test) {
    group = 'verification'
    description = 'Медленные тесты с тегом slow: только для теста, который не влезает в бюджет быстрого тира'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
    maxParallelForks = 1
    // Медленный тир гоняет свойства с повышенным числом попыток; число test и slowTest несравнимы
    // (в test ещё C1-only). Системное свойство перекрывает junit-platform.properties (jqwik читает его
    // через параметры конфигурации JUnit), но не явный @Property(tries = …). См. docs/TESTING.md.
    systemProperty 'jqwik.tries.default', '1000'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/slow/test-cost.csv'
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/slow/html')
    reports.junitXml.outputLocation = file('TestResults/slow/xml')
    shouldRunAfter tasks.named('test')
}

// Глубокий прогон свойств: 1000 попыток на каждое (docs/TESTING.md). Без фильтра тегов — все
// @Property идут с tries=1000. Не в check: предназначен для ночного прогона или по запросу.
tasks.register('propertyTest', Test) {
    group = 'verification'
    description = 'Свойства jqwik с 1000 попытками: глубокий прогон инвариантов'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'jqwik'
    }
    maxParallelForks = 1
    systemProperty 'jqwik.tries.default', '1000'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/property/test-cost.csv'
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/property/html')
    reports.junitXml.outputLocation = file('TestResults/property/xml')
    shouldRunAfter tasks.named('test')
}

// Подсветка долгих тестов (docs/TESTING.md → «Время тестов»): после test и slowTest печатает
// топ-10 по CPU потока и строки выше порога с пометкой МЕДЛЕННЫЙ. Пороги — в одном файле
// test-cost-thresholds.properties (миллисекунды). Логика отчёта — в TestCostReporter
// (JUnit-тест TestCostReporterTests проверяет её на таблице случаев).
tasks.register('testCostReport', JavaExec) {
    group = 'verification'
    description = 'Топ-10 и МЕДЛЕННЫЙ по CPU из CSV стоимости тестов'
    mustRunAfter tasks.named('test')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.theminespirit.testing.TestCostReporter'
    args 'TestResults/unit/test-cost.csv', 'src/test/resources/test-cost-thresholds.properties'
}

tasks.register('slowTestCostReport', JavaExec) {
    group = 'verification'
    description = 'Топ-10 и МЕДЛЕННЫЙ по CPU из CSV медленного тира'
    mustRunAfter tasks.named('slowTest')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.theminespirit.testing.TestCostReporter'
    args 'TestResults/slow/test-cost.csv', 'src/test/resources/test-cost-thresholds.properties'
}

// Пустой тир не должен молча зеленеть: если фильтр не нашёл ни одного теста,
// задача падает с понятным сообщением. failOnNoDiscoveredTests покрывает только случай
// без фильтров, а теги (test/slowTest) — это фильтры, поэтому считаем отчёты сами.
tasks.withType(Test).configureEach {
    def executedTests = new java.util.concurrent.atomic.AtomicLong()
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            executedTests.set(result.testCount)
        }
    }
    doLast {
        if (executedTests.get() == 0) {
            throw new GradleException("Тестовая задача '${name}' выполнила 0 тестов: проверьте фильтры " +
                    "(теги, --tests). Пустой тир не должен молча зеленеть (см. docs/TESTING.md).")
        }
    }
}

// check гоняет быстрый тир. slowTest намеренно НЕ входит в check: сейчас в нём нет тестов, а
// пустой тир по R10 падает, и check/build стали бы вечно красными. slowTest запускают отдельно,
// когда появится тяжёлый тест с замеренным временем (docs/TESTING.md).
tasks.named('check') {
    dependsOn tasks.named('test')
}

// Подсветка долгих печатается после прогона, даже зелёного (docs/TESTING.md → «Время тестов»)
tasks.named('test') {
    finalizedBy tasks.named('testCostReport')
}

tasks.named('slowTest') {
    finalizedBy tasks.named('slowTestCostReport')
}

// Покрытие JaCoCo — отчёт, а не гейт сборки (docs/TESTING.md).
// Версия инструмента — встроенная в Gradle, отдельно не выбирается (AGENTS.md).
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        csv.required = false
        xml.required = true
        xml.outputLocation = file('TestResults/coverage/jacoco.xml')
        html.required = true
        html.outputLocation = file('TestResults/coverage/html')
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Чистый мир на каждый прогон GameTest: build/gametest-run/world удаляется перед стартом,
// иначе мир растёт от прогона к прогону (docs/research/test-performance.md → п.7).
tasks.named('runGameTestServer') {
    doFirst {
        new File(gameDirectory.getAsFile().get(), 'world').deleteDir()
        // Прямой ./gradlew runGameTestServer запрещён: scripts/test.sh берёт замок
        // «один сервер на машину» и передаёт путь и одноразовый токен системными свойствами.
        // Токен пишется в маркер замка ($LOCK.d/token при mkdir, $LOCK.token при flock):
        // чужой токен не подставить, свой переживает только этот прогон.
        def lockPath = System.getProperty('theminespirit.gametest.lock')
        def token = (System.getProperty('theminespirit.gametest.token') ?: '').trim()
        if (!lockPath || !token) {
            throw new GradleException("runGameTestServer: прямой запуск без замка запрещён. Используй scripts/test.sh gametest (docs/TESTING.md): скрипт берёт замок и передаёт -Dtheminespirit.gametest.lock/-Dtheminespirit.gametest.token.")
        }
        def dirToken = new File(lockPath + '.d/token')
        def fileToken = new File(lockPath + '.token')
        def markerToken = dirToken.exists() ? dirToken.getText('UTF-8').trim() : (fileToken.exists() ? fileToken.getText('UTF-8').trim() : '')
        if (markerToken != token) {
            throw new GradleException("runGameTestServer: токен замка не совпадает (${markerToken ? 'устаревший или чужой замок' : 'замок отсутствует'}). Прямой запуск запрещён: scripts/test.sh gametest (docs/TESTING.md).")
        }
    }
}

// Инструмент текстовых построек (scripts/schematic.sh): тот же разбор и те же сторожа, что в моде, без запуска игры.
tasks.register('schematicTool', JavaExec) {
    group = 'theminespirit'
    description = 'Постройки в текстовом формате: show <файл|id> [поворот], check [файл|id…]'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.theminespirit.core.building.SchematicTool'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
    workingDir = projectDir
    args((System.getProperty('theminespirit.schematic.args') ?: '').split('\u0001').findAll { !it.isEmpty() })
}
