plugins {
    id 'theminespirit.java-conventions'
    id 'jacoco'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

dependencies {
    testImplementation project(':mod')
    testImplementation testFixtures(project(':test-fixtures'))
}

tasks.named('assemble') {
    dependsOn ':mod:assemble'
}

def unitTestThreads = (System.getenv('THEMINESPIRIT_TEST_THREADS') ?: "${Math.max(1, Math.min(5, Runtime.runtime.availableProcessors() - 1))}") as int
tasks.named('test', Test) {
    // lib: --changed/--module зовут задачи модулей напрямую; корневой test без свойства тянет все модули.
    if (!project.hasProperty('theminespirit.rootOnly')) {
        dependsOn ':guards:test', ':api:test', ':board:test', ':tactics:test', ':content:test', ':policy:test'
        dependsOn ':rest:test', ':ui:test', ':mod:test', ':gametest:test'
        dependsOn ':mech:mining:test', ':mech:movement:test', ':mech:inventory:test'
        dependsOn ':mech:farming:test', ':mech:forestry:test', ':mech:crafting:test', ':mech:husbandry:test'
        dependsOn ':mech:small:test', ':mech:building:test', ':mech:town:test'
    }
    useJUnitPlatform {
        excludeTags 'slow', 'mutation', 'export'
    }
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', "${unitTestThreads}"
    jvmArgs '-XX:+UseSerialGC', "-XX:ActiveProcessorCount=${Math.max(2, unitTestThreads)}"
    maxHeapSize = '512m'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/unit/test-cost.csv'
    systemProperty 'theminespirit.updateSnapshots',
            System.getProperty('theminespirit.updateSnapshots', System.getenv('THEMINESPIRIT_UPDATE_SNAPSHOTS') ?: 'false')
    failOnNoDiscoveredTests = !project.hasProperty('theminespirit.filtered')
    filter { setFailOnNoMatchingTests(!project.hasProperty('theminespirit.filtered')) }
    reports.html.outputLocation = file('TestResults/unit/html')
    reports.junitXml.outputLocation = file('TestResults/unit/xml')
}

tasks.named('staticAnalysisFast') {
    dependsOn ':test-fixtures:staticAnalysisFast'
    dependsOn ':guards:staticAnalysisFast', ':api:staticAnalysisFast'
    dependsOn ':board:staticAnalysisFast'
    dependsOn ':tactics:staticAnalysisFast'
    dependsOn ':content:staticAnalysisFast'
    dependsOn ':rest:staticAnalysisFast'
    dependsOn ':ui:staticAnalysisFast'
    dependsOn ':policy:staticAnalysisFast'
    dependsOn ':mod:staticAnalysisFast', ':gametest:staticAnalysisFast'
    dependsOn ':mech:mining:staticAnalysisFast', ':mech:movement:staticAnalysisFast', ':mech:inventory:staticAnalysisFast'
    dependsOn ':mech:farming:staticAnalysisFast'
    dependsOn ':mech:forestry:staticAnalysisFast'
    dependsOn ':mech:crafting:staticAnalysisFast'
    dependsOn ':mech:husbandry:staticAnalysisFast'
    dependsOn ':mech:small:staticAnalysisFast', ':mech:building:staticAnalysisFast', ':mech:town:staticAnalysisFast'
}
tasks.named('staticAnalysis') {
    dependsOn ':test-fixtures:staticAnalysis'
    dependsOn ':guards:staticAnalysis', ':api:staticAnalysis'
    dependsOn ':board:staticAnalysis'
    dependsOn ':tactics:staticAnalysis'
    dependsOn ':content:staticAnalysis'
    dependsOn ':rest:staticAnalysis'
    dependsOn ':ui:staticAnalysis'
    dependsOn ':policy:staticAnalysis'
    dependsOn ':mod:staticAnalysis', ':gametest:staticAnalysis'
    dependsOn ':mech:mining:staticAnalysis', ':mech:movement:staticAnalysis', ':mech:inventory:staticAnalysis'
    dependsOn ':mech:farming:staticAnalysis'
    dependsOn ':mech:forestry:staticAnalysis'
    dependsOn ':mech:crafting:staticAnalysis'
    dependsOn ':mech:husbandry:staticAnalysis'
    dependsOn ':mech:small:staticAnalysis', ':mech:building:staticAnalysis', ':mech:town:staticAnalysis'
}

tasks.register('slowTest', Test) {
    group = 'verification'
    description = 'Медленные тесты с тегом slow: только для теста, который не влезает в бюджет быстрого тира'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
    maxParallelForks = 1
    systemProperty 'jqwik.tries.default', '1000'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/slow/test-cost.csv'
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/slow/html')
    reports.junitXml.outputLocation = file('TestResults/slow/xml')
    shouldRunAfter tasks.named('test')
}

tasks.register('mutationTest', Test) {
    group = 'verification'
    description = 'Мутационный перебор ситуаций доски и графа (тег mutation): бюджет 10–20 минут, выборки с ротацией сида'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mutation'
    }
    maxParallelForks = (System.getenv('THEMINESPIRIT_MUTATION_FORKS') ?: "${Math.max(1, Math.min(5, Runtime.runtime.availableProcessors() - 1))}") as int
    maxHeapSize = '2g'
    systemProperty 'theminespirit.modId', project.mod_id
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/mutation/html')
    reports.junitXml.outputLocation = file('TestResults/mutation/xml')
}

tasks.register('graphExport', Test) {
    group = 'verification'
    description = 'Выгрузка графа и контрольных случаев для Python-модели (tools/graph-gpu): TestResults/graph-export'
    dependsOn ':guards:graphExport', ':board:graphExport', ':tactics:graphExport', ':content:graphExport', ':rest:graphExport'
    dependsOn ':ui:graphExport', ':policy:graphExport'
    dependsOn ':mech:mining:graphExport', ':mech:movement:graphExport', ':mech:inventory:graphExport'
    dependsOn ':mech:farming:graphExport', ':mech:forestry:graphExport', ':mech:crafting:graphExport'
    dependsOn ':mech:husbandry:graphExport', ':mech:small:graphExport', ':mech:building:graphExport'
    dependsOn ':mech:town:graphExport'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'export'
    }
    maxParallelForks = 1
    systemProperty 'theminespirit.modId', project.mod_id
    failOnNoDiscoveredTests = false
    reports.html.outputLocation = file('TestResults/graph-export/html')
    reports.junitXml.outputLocation = file('TestResults/graph-export/xml')
}

tasks.register('propertyTest', Test) {
    group = 'verification'
    description = 'Свойства jqwik с 1000 попытками: глубокий прогон инвариантов'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'jqwik'
    }
    maxParallelForks = 1
    systemProperty 'jqwik.tries.default', '1000'
    systemProperty 'theminespirit.modId', project.mod_id
    systemProperty 'theminespirit.testCost.csv', 'TestResults/property/test-cost.csv'
    failOnNoDiscoveredTests = true
    reports.html.outputLocation = file('TestResults/property/html')
    reports.junitXml.outputLocation = file('TestResults/property/xml')
    shouldRunAfter tasks.named('test')
}

def unitCostCsv = layout.projectDirectory.file('TestResults/unit/test-cost.csv')
tasks.register('testCostReport', JavaExec) {
    group = 'verification'
    description = 'Топ-10 и МЕДЛЕННЫЙ по CPU из CSV стоимости тестов'
    mustRunAfter tasks.named('test')
    // lib: при фильтре, который не задел тесты корня, CSV нет — отчёт не должен ронять прогон.
    onlyIf { unitCostCsv.asFile.exists() }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.theminespirit.testing.TestCostReporter'
    args 'TestResults/unit/test-cost.csv', 'src/test/resources/test-cost-thresholds.properties'
}

def slowCostCsv = layout.projectDirectory.file('TestResults/slow/test-cost.csv')
tasks.register('slowTestCostReport', JavaExec) {
    group = 'verification'
    description = 'Топ-10 и МЕДЛЕННЫЙ по CPU из CSV медленного тира'
    mustRunAfter tasks.named('slowTest')
    onlyIf { slowCostCsv.asFile.exists() }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.theminespirit.testing.TestCostReporter'
    args 'TestResults/slow/test-cost.csv', 'src/test/resources/test-cost-thresholds.properties'
}

tasks.withType(Test).configureEach {
    def executedTests = new java.util.concurrent.atomic.AtomicLong()
    def filteredRun = project.hasProperty('theminespirit.filtered')
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            executedTests.set(result.testCount)
        }
    }
    doLast {
        if (executedTests.get() == 0 && !filteredRun && name != 'graphExport') {
            throw new GradleException("Тестовая задача '${name}' выполнила 0 тестов: проверьте фильтры " +
                    "(теги, --tests). Пустой тир не должен молча зеленеть (см. docs/TESTING.md).")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('test')
}

tasks.named('pmdMain') {
    dependsOn ':guards:pmdMain', ':api:pmdMain', ':board:pmdMain', ':tactics:pmdMain', ':content:pmdMain', ':test-fixtures:pmdMain', ':policy:pmdMain'
    dependsOn ':rest:pmdMain', ':ui:pmdMain', ':mod:pmdMain', ':gametest:pmdMain'
    dependsOn ':mech:mining:pmdMain', ':mech:movement:pmdMain', ':mech:inventory:pmdMain'
    dependsOn ':mech:farming:pmdMain', ':mech:forestry:pmdMain', ':mech:crafting:pmdMain', ':mech:husbandry:pmdMain'
    dependsOn ':mech:small:pmdMain', ':mech:building:pmdMain', ':mech:town:pmdMain'
}

tasks.named('pmdTest') {
    dependsOn ':guards:pmdTest', ':api:pmdTest', ':board:pmdTest', ':tactics:pmdTest', ':content:pmdTest', ':test-fixtures:pmdTest', ':policy:pmdTest'
    dependsOn ':rest:pmdTest', ':ui:pmdTest', ':mod:pmdTest', ':gametest:pmdTest'
    dependsOn ':mech:mining:pmdTest', ':mech:movement:pmdTest', ':mech:inventory:pmdTest'
    dependsOn ':mech:farming:pmdTest', ':mech:forestry:pmdTest', ':mech:crafting:pmdTest', ':mech:husbandry:pmdTest'
    dependsOn ':mech:small:pmdTest', ':mech:building:pmdTest', ':mech:town:pmdTest'
}

tasks.named('test') {
    finalizedBy tasks.named('testCostReport')
}

// lib: тиры собираются по модулям: ./gradlew slowTest | mutationTest гоняет тир каждого модуля.
// Пустой тир модуля без таких тестов не красный (сторож тира — failOnNoDiscoveredTests в модуле,
// он включается, только если тег в исходниках реально есть).
gradle.projectsEvaluated {
    def tierModules = subprojects.findAll { it.plugins.hasPlugin('theminespirit.module') }
    ['slowTest', 'mutationTest'].each { String tier ->
        tasks.named(tier) {
            dependsOn tierModules.collect { "${it.path}:${tier}" }
            failOnNoDiscoveredTests = false
        }
    }
}

tasks.named('slowTest') {
    finalizedBy tasks.named('slowTestCostReport')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        csv.required = false
        xml.required = true
        xml.outputLocation = file('TestResults/coverage/jacoco.xml')
        html.required = true
        html.outputLocation = file('TestResults/coverage/html')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
