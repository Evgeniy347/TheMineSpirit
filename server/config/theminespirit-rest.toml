[rest]
	#Запускать ли REST-мост для внешнего ИИ-агента при старте выделенного сервера.
	enabled = true
	#TCP-порт REST-моста. Авторизации нет: порт открыт всем, кто достигает адрес привязки.
	# Default: 8765
	# Range: 1024 ~ 65535
	port = 8765
	#Адрес привязки. 0.0.0.0 — вся локальная сеть, 127.0.0.1 — только этот компьютер.
	bindAddress = "0.0.0.0"
	#Файл-сердцебиение серверного тика: сторож зависания читает его, когда REST не отвечает.
	heartbeatFile = "/opt/minecraft/logs/tick.heartbeat"
	#Замок живой отладки: пока он держится, зависание считается паузой на брейкпоинте.
	debugLeaseFile = "/opt/minecraft/debug.lease"
	#Сколько секунд без тика считать зависанием; сторож перезапускает сервер после порога.
	# Range: 30 ~ 3600
	hangAfterSeconds = 180
