pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'net.neoforged.moddev' version "${moddev_plugin_version}"
        id 'com.diffplug.spotless' version "${spotless_plugin_version}"
        id 'net.ltgt.errorprone' version "${errorprone_plugin_version}"
        id 'com.github.spotbugs' version "${spotbugs_plugin_version}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'the-mine-spirit'

includeBuild('build-logic')

include ':api'
include ':test-fixtures'
include ':policy'
include ':mech:farming'
include ':mech:forestry'
include ':mech:crafting'
include ':mech:husbandry'
include ':mech:small'
include ':board'
include ':tactics'
include ':content'
include ':rest'
include ':ui'
include ':mod'
include ':mech:mining'
include ':mech:movement'
include ':mech:inventory'
include ':mech:building'
include ':mech:town'

def mechanicsModules = [':policy']
