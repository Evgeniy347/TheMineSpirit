// lib: репозитории build-logic — только здесь: project-уровень молча выключает settings (Gradle 9) и рвёт
// offline-кэш сервера, собранный с другим набором репозиториев.
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForged Releases'
            url = 'https://maven.neoforged.net/releases/'
            content {
                includeGroupByRegex 'net\\.neoforged.*'
            }
        }
    }
}

rootProject.name = 'build-logic'
