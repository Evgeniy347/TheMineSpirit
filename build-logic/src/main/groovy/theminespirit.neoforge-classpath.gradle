// lib: единственное место, где модуль получает classpath Minecraft/NeoForge.
// Механика с neoforge-кодом применяет этот конвеншен вместе с theminespirit.module,
// а не копирует neoForge{version/parchment} в свой build.gradle.
plugins {
    id 'theminespirit.java-conventions'
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
}
