plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs'
}

def rootProperties = new Properties()
file("${rootProject.projectDir}/gradle.properties").withInputStream { rootProperties.load(it) }
def versionOf = { String key -> rootProperties.getProperty(key) }
def configAt = { String relative -> new File(rootProject.projectDir, "config/${relative}") }

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    errorprone "com.google.errorprone:error_prone_core:${versionOf('errorprone_version')}"
    errorprone "com.uber.nullaway:nullaway:${versionOf('nullaway_version')}"
    compileOnly "org.jspecify:jspecify:${versionOf('jspecify_version')}"
    testCompileOnly "org.jspecify:jspecify:${versionOf('jspecify_version')}"

    testImplementation platform("org.junit:junit-bom:${versionOf('junit_version')}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.junit.platform:junit-platform-launcher"
    testImplementation "net.jqwik:jqwik:${versionOf('jqwik_version')}"
    testImplementation "com.tngtech.archunit:archunit:${versionOf('archunit_version')}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing', '-Werror'])
    options.errorprone {
        disableWarningsInGeneratedCode = true
        disable('UnnecessaryLambda')
        disable('ImmutableEnumChecker')
    }
}

tasks.named('compileJava', JavaCompile) {
    options.errorprone {
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        option('NullAway:AnnotatedPackages', 'com.theminespirit.core')
    }
}

tasks.named('compileTestJava', JavaCompile) {
    options.errorprone.disable('NullAway')
}

tasks.named('compileTestFixturesJava', JavaCompile) {
    options.errorprone.enabled = false
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat(versionOf('palantir_java_format_version'))
    }
}

checkstyle {
    toolVersion = versionOf('checkstyle_version')
    configFile = configAt('checkstyle/checkstyle.xml')
    maxWarnings = 0
    ignoreFailures = false
}

pmd {
    toolVersion = versionOf('pmd_version')
    consoleOutput = false
    ignoreFailures = false
    ruleSets = []
}
tasks.named('pmdMain', Pmd) {
    ruleSetFiles = files(configAt('pmd/main.xml'))
}
tasks.named('pmdTest', Pmd) {
    ruleSetFiles = files(configAt('pmd/test.xml'))
}
// lib: java-test-fixtures создаёт pmdTestFixtures, а правило pmd { ruleSets = [] } оставляет её без набора правил —
// задача падала «No rulesets specified» и валила check. Фикстуры — тестовый код, им подходит набор тестов.
tasks.named('pmdTestFixtures', Pmd) {
    ruleSetFiles = files(configAt('pmd/test.xml'))
}

spotbugs {
    toolVersion = versionOf('spotbugs_version')
    ignoreFailures = false
    excludeFilter = configAt('spotbugs/exclude.xml')
}
tasks.named('spotbugsTest') {
    excludeFilter = configAt('spotbugs/exclude-test.xml')
}
// lib: spotbugsTestFixtures проверяет тестовые фикстуры — им нужен набор исключений тестов, а не боевого кода
// (Random с явным зерном — воспроизводимый генератор сценария).
tasks.named('spotbugsTestFixtures') {
    excludeFilter = configAt('spotbugs/exclude-test.xml')
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    // lib: -release — метка версии в отчёте, детекторы её не читают. У :mod версия 0.1.N считается от числа
    // коммитов, поэтому project.version менял ключ кэша SpotBugs на каждом коммите и неизменный код
    // анализировался заново. Минор версии между коммитами стабилен.
    release.set(versionOf('mod_version_minor'))
    reports {
        xml.required = true
        html.required = false
    }
}
// lib: sourcepath нужен SpotBugs только для исходников в отчёте, но входит в ключ кэша содержимым файлов.
// Каталоги ресурсов к анализу классов отношения не имеют: правка json заставляла повторять анализ модуля.
// Оставляем в sourceDirs только java-исходники своей области.
tasks.named('spotbugsMain') {
    sourceDirs.setFrom(sourceSets.main.allJava.srcDirs)
}
tasks.named('spotbugsTest') {
    sourceDirs.setFrom(sourceSets.test.allJava.srcDirs)
}

tasks.register('staticAnalysisFast') {
    group = 'verification'
    description = 'Быстрые анализаторы: формат (Spotless), Checkstyle — без SpotBugs и PMD'
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
}

tasks.register('staticAnalysis') {
    group = 'verification'
    description = 'Строгие анализаторы кода: формат (Spotless) и остальные быстрые и строгие проверки'
    dependsOn tasks.named('staticAnalysisFast')
    dependsOn tasks.named('pmdMain'), tasks.named('pmdTest')
    dependsOn tasks.named('spotbugsMain'), tasks.named('spotbugsTest')
}

tasks.named('check') {
    dependsOn tasks.named('staticAnalysis')
}

// lib: владелец 07.11 — SpotBugs, PMD и Checkstyle выключены ради времени сборки; включить: -Ptheminespirit.analyzers=on
// lib: или analyzers=on в gradle.properties. Spotless (формат) и Error Prone (в компиляторе) работают всегда.
if (findProperty('theminespirit.analyzers') != 'on') {
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach { enabled = false }
    tasks.withType(Pmd).configureEach { enabled = false }
    tasks.withType(Checkstyle).configureEach { enabled = false }
}

if (project != rootProject) {
    tasks.withType(Test).configureEach {
        reports.html.outputLocation = rootProject.file("TestResults/${project.name}/html")
        reports.junitXml.outputLocation = rootProject.file("TestResults/${project.name}/xml")
        systemProperty 'theminespirit.testCost.csv', "TestResults/${project.name}/test-cost.csv"
    }
}
