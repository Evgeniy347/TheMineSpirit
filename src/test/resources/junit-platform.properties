# jqwik: N прогонов свойства и база упавших seed (docs/TESTING.md)
jqwik.tries.default=1000
jqwik.database=.jqwik-database

# Параллельный прогон Jupiter: классы — параллельно, методы внутри класса — последовательно.
# Так сторожа, читающие общие файлы, не мешают друг другу (docs/TESTING.md).
# jqwik-свойства помечены тегом slow и в этот прогон не попадают (см. build.gradle).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
