# jqwik: N прогонов свойства (docs/TESTING.md). База упавших seed задаётся в build.gradle
# отдельным файлом на форк Gradle, чтобы два JVM не писали один файл.
jqwik.tries.default=1000

# Параллельный прогон Jupiter: классы — параллельно, методы внутри класса — последовательно.
# Правило: тест не держит изменяемого static-состояния и не пишет общих файлов.
# Свойства jqwik идут в том же быстром тире (docs/TESTING.md).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
