# jqwik: N прогонов свойства и база seed упавших прогонов (docs/TESTING.md).
# Один файл: быстрый тир идёт последовательно (maxParallelForks = 1), двум JVM писать в него не приходится.
# Быстрый тир — 200 попыток (docs/research/test-performance.md → рек. 5): свойств 22, и 1000 попыток на
# каждое даёт −20 % CPU лишь на старой нагрузке. slowTest перекрывает это системным свойством 1000.
# Значение действует только на свойства без явного tries (jqwik: @Property(tries = …) сильнее файла).
jqwik.tries.default=200
jqwik.database=.jqwik-database

# Параллельный прогон Jupiter выключен: замер на 4 ядрах показал, что и форки, и параллельные
# классы дороже последовательного прогона (числа — docs/TESTING.md → «Параллельный прогон и теги»).
# Свойства jqwik идут тем же быстрым тиром.
junit.jupiter.execution.parallel.enabled=false
